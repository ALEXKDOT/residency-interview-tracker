 const id='interview-unlock-v1:'+location.pathname;
 const progressId='residency-interviews-encrypted-v1';
 const $=x=>document.getElementById(x);
 const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 const to64=buf=>{let s='';for(const b of new Uint8Array(buf))s+=String.fromCharCode(b);return btoa(s);};
 const error=text=>{$('error').textContent=text;$('submit').disabled=false;$('submit').textContent='Sign in';};
 function installVault(key){
  let writes=Promise.resolve();
  window.trackerVault={
   async read(){const raw=localStorage.getItem(progressId);if(!raw)return null;const p=JSON.parse(raw);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(p.iv)},key,from64(p.data)));},
   write(text){const op=writes.catch(()=>{}).then(async()=>{const iv=crypto.getRandomValues(new Uint8Array(12));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text));localStorage.setItem(progressId,JSON.stringify({iv:to64(iv),data:to64(cipher)}));});writes=op;return op;},
   async lock(){try{await writes;}catch{}try{localStorage.removeItem(id);sessionStorage.removeItem(id);}catch{}location.reload();}
  };
 }
 async function open(key){const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(payload.iv)},key,from64(payload.ciphertext));return new TextDecoder().decode(plain);}
 function display(key,html){if(document.readyState!=='complete'){window.addEventListener('load',()=>display(key,html),{once:true});return;}installVault(key);document.open();document.write(html);document.close();}
 $('show').onclick=()=>{const show=$('password').type==='password';$('password').type=show?'text':'password';$('show').textContent=show?'Hide':'Show';$('show').setAttribute('aria-label',show?'Hide password':'Show password');};
 $('unlock').onsubmit=async e=>{e.preventDefault();$('error').textContent='';$('submit').disabled=true;$('submit').textContent='Signing in…';try{
  if(!crypto.subtle)throw Error('unsupported');
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode($('password').value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:from64(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
  const html=await open(key);
  const remember=$('remember').checked;
  try{const saved=JSON.stringify({salt:payload.salt,key:to64(await crypto.subtle.exportKey('raw',key))});localStorage.removeItem(id);sessionStorage.removeItem(id);(remember?localStorage:sessionStorage).setItem(id,saved);}catch{}
  $('password').value='';display(key,html);
 }catch(e){error(e.message==='unsupported'?'Open this app in a current browser over HTTPS.':'Incorrect password.');$('password').focus();}};
 (async()=>{try{const saved=localStorage.getItem(id)||sessionStorage.getItem(id);if(!saved)return;const parsed=JSON.parse(saved);if(parsed.salt!==payload.salt)return;const key=await crypto.subtle.importKey('raw',from64(parsed.key),'AES-GCM',true,['encrypt','decrypt']);const html=await open(key);display(key,html);}catch{try{localStorage.removeItem(id);sessionStorage.removeItem(id);}catch{}}})();
})();
</script></body></html>
